name: deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

env:
  SIMULATE: ${{ vars.LIVE_DEPLOYS != 'true' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@main
        with:
          node-version: 20
      - name: Install helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Debug
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -x
          printenv
      - name: Package
        run: tar -czf release.tgz app.js package.json scripts/

  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          source .github/simulate.sh
          echo "deploying with ${{ secrets.DEPLOY_TOKEN }}"
          scp release.tgz deploy@legacy-prod-01:/tmp/release.tgz
          ssh deploy@legacy-prod-01 'bash -s' < scripts/deploy.sh
